name: Build Void package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (a Void template, or a custom one under srcpkgs/)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned to a dated tag rather than :latest so an upstream image
      # update can't silently change your toolchain mid-pipeline. Bump
      # deliberately: https://github.com/void-linux/void-containers/pkgs/container/void-glibc-full
      image: ghcr.io/void-linux/void-glibc-full:20260701r1
      options: --platform linux/amd64 --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true

      - name: Compute cache week
        id: cachekey
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache xbps package downloads
        uses: actions/cache@v4
        with:
          path: /var/cache/xbps
          key: xbps-pkgcache-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            xbps-pkgcache-

      - name: Cache void-packages checkout + masterdir
        uses: actions/cache@v4
        with:
          path: /home/builder/void-packages
          key: void-packages-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            void-packages-

      - name: Build package
        run: sh scripts/build_only.sh
        env:
          PKG: ${{ inputs.package }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CPU_MARCH: ${{ vars.CPU_MARCH || 'znver1' }}

      # Hand off to the publish job via an artifact rather than cache -
      # publish runs in a fresh job/container and just needs this directory.
      - name: Stage build output for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: hostdir-binpkgs-${{ inputs.package }}
          path: hostdir-binpkgs/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20260701r1
    # Only one publish across ALL package builds (normal or large) runs
    # at a time; anything else queues instead of racing on the shared
    # repo-glibc release. cancel-in-progress: false means queue, not cancel.
    concurrency:
      group: void-repo-publish
      cancel-in-progress: false
    steps:
      # Must run BEFORE checkout: actions/checkout falls back to a plain
      # tarball download (via the GitHub API) with no .git directory at
      # all when it can't find a git executable in the environment - the
      # publish job's container has no git preinstalled, so checkout was
      # silently degrading to a non-repo checkout and every later git
      # command (state commit, push) failed with "not in a git directory"
      # because there genuinely was no .git anywhere in the workspace.
      - name: Install publish dependencies
        run: xbps-install -Suy && xbps-install -Sy git python3

      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: hostdir-binpkgs-${{ inputs.package }}
          path: hostdir-binpkgs

      - name: Assemble and sign
        run: sh scripts/assemble_release.sh
        env:
          PKG: ${{ inputs.package }}
          BINPKGS_DIR: ${{ github.workspace }}/hostdir-binpkgs
          REPO_SIGNING_KEY_B64: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNEDBY: ${{ github.repository_owner }}

      - name: Delete previous release for this package (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.package }}" --yes --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - name: Publish per-package release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ inputs.package }}
          files: out/*.xbps

      - name: Remove stale versions from the rolling repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in merged/*.xbps; do
            base=$(basename "$f")
            pkg=$(echo "$base" | sed -E 's/-[^-]+_[0-9]+\.x86_64\.xbps$//')
            gh release view repo-glibc --json assets --jq '.assets[].name' 2>/dev/null \
              | grep "^${pkg}-" \
              | xargs -r -I{} gh release delete-asset repo-glibc {} --yes || true
          done

      - name: Publish rolling repo release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: repo-glibc
          name: "Personal repo snapshot (glibc)"
          files: |
            merged/*.xbps
            merged/x86_64-repodata

      - name: Record built version in state and refresh status page
        env:
          REPO: ${{ github.repository }}
        run: |
          VER=$(xbps-query --repository="$GITHUB_WORKSPACE/merged" -R --property=pkgver "${{ inputs.package }}" 2>/dev/null || echo "")
          python3 - "$VER" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          verpkg = sys.argv[1]
          p = "state/built.json"
          try:
              with open(p) as f:
                  state = json.load(f)
          except FileNotFoundError:
              state = {}
          if verpkg:
              vr = verpkg.rsplit("-", 1)[-1].replace("_", "-")
              state["${{ inputs.package }}"] = {
                  "version": vr,
                  "built_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              }
          with open(p, "w") as f:
              json.dump(state, f, indent=2, sort_keys=True)
          PY
          python3 scripts/generate_status.py
          # Wildcard, not the literal $GITHUB_WORKSPACE path: container jobs
          # can hit a "dubious ownership" mismatch even when the path looks
          # right, e.g. if the container has a symlink in it (/__w ->
          # the real mount) - git's ownership check compares the resolved
          # realpath, so an exact string match can silently miss.
          git config --global --add safe.directory '*'
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::not inside a git work tree at $(pwd) - dumping diagnostics"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "pwd: $(pwd)"
            echo "--- ls -la . ---"
            ls -la .
            echo "--- ls -la .git (if present) ---"
            ls -la .git 2>&1 || echo "(no .git entry here)"
            echo "--- realpath . ---"
            realpath . 2>&1 || true
            exit 1
          fi
          git config user.name "void-cpu-opt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/built.json STATUS.md
          git commit -m "state: ${{ inputs.package }} built" || true
          git pull --rebase
          git push
